# ASCIIMoon for Hyprland — `source = ~/.config/hypr/asciimoon.conf` from hyprland.conf
# Pick ONE of the two options below.

# ── Option A: moon on your wallpaper (recommended, needs kitty) ────────────────
# kitty's panel kitten draws a transparent layer-shell surface *behind* all
# windows, so the moon sits on the desktop like conky. No window rules needed.
exec-once = kitty +kitten panel --edge=background -o background_opacity=0 -o font_size=7 asciimoon --watch

# ── Option B: a pinned floating terminal (any terminal) ───────────────────────
# exec-once = [float; pin; size 520 420; move 100%-540 60; noborder; noshadow] kitty --class asciimoon -o background_opacity=0.6 -o font_size=6 asciimoon --watch
# exec-once = [float; pin; size 520 420; move 100%-540 60] foot --app-id asciimoon -o font=monospace:size=6 asciimoon --watch
#
# Handy extras (also applied by class, so they survive restarts of the widget):
# windowrule = float, class:^(asciimoon)$
# windowrule = pin, class:^(asciimoon)$
# windowrule = noblur, class:^(asciimoon)$
# windowrule = nofocus, class:^(asciimoon)$
#
# NOTE: windowrule syntax has changed between Hyprland releases — if these lines
# error on your version, translate them with https://wiki.hypr.land/Configuring/Window-Rules/

# Toggle a big interactive moon (h/l = day, space = animate month, q = close)
# bind = SUPER, M, exec, kitty --class asciimoon-big asciimoon --watch
